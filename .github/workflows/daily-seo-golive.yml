name: Daily SEO go-live

# Elke dag 09:00 Europe/Amsterdam (cron UTC 07:00)
# Publiceert max. 2 QUEUE-items met status "approved" en datum ≤ vandaag.
# Nooit idee/draft. Handmatig: Actions → Daily SEO go-live → Run workflow.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  golive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run go-live
        run: node _seo/daily-golive.mjs

      - name: Commit if changed
        run: |
          git config user.name "aanbouwdirect-seo-bot"
          git config user.email "seo-bot@aanbouw.direct"
          git add -A
          git diff --staged --quiet || git commit -m "chore(seo): daily go-live $(date -u +%Y-%m-%d)"
          git push
